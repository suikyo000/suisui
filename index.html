<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ローン比較</title>
<meta name="theme-color" content="#2a78d6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ローン比較">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link id="appicon" rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  color-scheme: light;
  --page:           #f9f9f7;
  --surface-1:      #fcfcfb;
  --field-bg:       #ffffff;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --gridline:       #e1e0d9;
  --border:         rgba(11,11,11,0.10);
  --series-1:       #2a78d6;
  --series-2:       #eb6834;
  --on-accent:      #ffffff;
  --danger:         #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page:           #0d0d0d;
    --surface-1:      #1a1a19;
    --field-bg:       #232322;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --border:         rgba(255,255,255,0.10);
    --series-1:       #3987e5;
    --series-2:       #d95926;
    --on-accent:      #ffffff;
    --danger:         #e66767;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text-primary);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  padding-bottom: calc(64px + env(safe-area-inset-bottom));
  overscroll-behavior-y: contain;
  -webkit-tap-highlight-color: transparent;
}

/* ---------- header ---------- */
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--surface-1);
  border-bottom: 1px solid var(--border);
  padding: calc(11px + env(safe-area-inset-top)) 16px 11px;
}
header h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: .01em; }
header p  { margin: 1px 0 0; font-size: 11px; color: var(--text-muted); }
header .ver {
  position: absolute; right: 16px; top: calc(13px + env(safe-area-inset-top));
  font-size: 10px; color: var(--text-muted); font-variant-numeric: tabular-nums;
}

main { padding: 14px 16px 8px; max-width: 720px; margin: 0 auto; overflow-x: clip; }
.page[hidden] { display: none; }

h2 { margin: 0 0 8px; font-size: 12px; font-weight: 650; color: var(--text-secondary); letter-spacing: .04em; }
h2 .count { color: var(--text-muted); font-weight: 400; margin-left: 6px; }

/* ---------- buttons ---------- */
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid transparent; }
button:disabled { opacity: .35; cursor: default; }
.btn-ghost {
  background: var(--surface-1); color: var(--text-secondary);
  border: 1px solid var(--border); padding: 9px 14px; font-size: 13px;
}
.btn-ghost.danger { color: var(--danger); }

/* ---------- condition tab strip ---------- */
.tabstrip {
  display: flex; gap: 6px; overflow-x: auto; padding-bottom: 12px;
  scrollbar-width: none; -ms-overflow-style: none;
  user-select: none; -webkit-user-select: none;
}
.tabstrip::-webkit-scrollbar { display: none; }
.tabstrip button {
  flex: none; padding: 7px 15px; font-size: 13px; border-radius: 999px;
  background: var(--surface-1); border: 1px solid var(--border); color: var(--text-secondary);
  max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  -webkit-touch-callout: none;
}
/* 長押しドラッグで並べ替え中のタブ */
.tabstrip button.drag-src {
  position: relative; z-index: 5;
  box-shadow: 0 8px 20px rgba(0, 0, 0, .28);
  cursor: grabbing;
}
.hintlabel { font-weight: 400; color: var(--text-muted); margin-left: 8px; font-size: 11px; }
.tabstrip button[aria-selected="true"] {
  background: var(--series-1); color: var(--on-accent);
  border-color: var(--series-1); font-weight: 600;
}
.tabstrip .addtab { color: var(--series-1); font-weight: 650; padding: 7px 14px; }

/* ---------- condition panel ---------- */
.card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
}
.name {
  display: block; width: 100%;
  font: inherit; font-size: 16px; font-weight: 650; color: var(--text-primary);
  background: transparent; border: none; border-bottom: 1px dashed var(--border);
  padding: 3px 2px 7px; margin-bottom: 4px;
}
.nm-hint { margin: 0 0 14px 2px; min-height: 0; }
.name:focus { outline: none; border-bottom-color: var(--series-1); border-bottom-style: solid; }

.fields { display: grid; grid-template-columns: 1fr; gap: 12px; }
.fields > label { display: block; font-size: 12px; color: var(--text-secondary); }
.f { display: flex; align-items: stretch; gap: 8px; margin-top: 4px; }
.f input {
  flex: 1 1 auto; min-width: 0; width: 100%;
  font: inherit; font-size: 17px; font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--text-primary); background: var(--field-bg);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 9px 10px; text-align: right;
}
.f input:focus { outline: 2px solid var(--series-1); outline-offset: -1px; }
.f input.bad { border-color: var(--danger); }
.unit { font-size: 12px; color: var(--text-muted); flex: none; align-self: center; }
.unitsel {
  flex: none; font: inherit; font-size: 13px; font-weight: 600;
  color: var(--text-secondary); background: var(--field-bg);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 0 8px; cursor: pointer; min-width: 62px;
}
.unitsel:focus { outline: 2px solid var(--series-1); outline-offset: -1px; }
.hint { display: block; min-height: 15px; margin-top: 3px; font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

.result { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--gridline); }
.r-lab { font-size: 11px; color: var(--text-muted); display: block; }
.r-val { font-size: 30px; font-weight: 650; letter-spacing: -.015em; display: block; margin-top: 1px; }
.r-sub { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 9px; font-size: 12px; color: var(--text-secondary); }
.r-sub b { font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; }

.card-actions { display: flex; gap: 8px; margin-top: 16px; }
.card-actions button { flex: 1 1 0; }

/* ---------- chips (graph filter) ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.chip {
  padding: 7px 13px; border-radius: 999px; font-size: 12px;
  background: var(--surface-1); border: 1px solid var(--border); color: var(--text-secondary);
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chip[aria-pressed="true"] {
  background: var(--series-1); color: var(--on-accent);
  border-color: var(--series-1); font-weight: 600;
}

/* ---------- charts ---------- */
figure { margin: 0 0 16px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 15px; }
figcaption { font-size: 13px; font-weight: 650; margin-bottom: 2px; }
.fig-sub { font-size: 11px; color: var(--text-muted); margin: 0 0 13px; }

.legend { display: flex; gap: 16px; margin: 0 0 13px; font-size: 12px; color: var(--text-secondary); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; flex: none; }

.brow { padding: 7px 0; border-radius: 6px; }
.brow + .brow { margin-top: 2px; }
.blab { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 5px; }
.bname { font-size: 12px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bval { font-size: 13px; font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; flex: none; }
.btrack { height: 16px; display: flex; gap: 2px; transform-origin: 0 50%; }
.bfill { height: 100%; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 6px; transform-origin: 0 50%; }
.seg { height: 100%; min-width: 0; }
.seg.p { background: var(--series-1); }
.seg.i { background: var(--series-2); border-radius: 0 4px 4px 0; }
.seg.end { border-radius: 0 4px 4px 0; }

.empty { color: var(--text-muted); font-size: 13px; text-align: center; padding: 40px 20px; margin: 0; line-height: 1.8; }

/* ---------- tooltip ---------- */
#tip {
  position: fixed; z-index: 60; pointer-events: none;
  background: var(--surface-1); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 10px;
  box-shadow: 0 6px 24px rgba(0,0,0,.18);
  padding: 10px 12px; font-size: 12px; line-height: 1.6;
  max-width: 240px; opacity: 0; transition: opacity .12s;
}
#tip.on { opacity: 1; }
#tip .t-name { font-weight: 650; margin-bottom: 4px; }
#tip .t-row { display: flex; justify-content: space-between; gap: 14px; }
#tip .t-row span:last-child { font-variant-numeric: tabular-nums; }
#tip .t-key { color: var(--text-secondary); display: inline-flex; align-items: center; gap: 5px; }
#tip .t-key i { width: 8px; height: 8px; border-radius: 2px; flex: none; }

/* ---------- table view ---------- */
details { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; }
summary { padding: 13px 15px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-secondary); }
summary::marker { color: var(--text-muted); }
.tablewrap { overflow-x: auto; padding: 0 15px 15px; }
table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--gridline); }
th { color: var(--text-muted); font-weight: 500; font-size: 11px; }
th:first-child, td:first-child { text-align: left; }
tbody tr:last-child td { border-bottom: none; }

/* ---------- notices / footer ---------- */
.notice {
  background: var(--surface-1); border: 1px solid var(--border); border-left: 3px solid var(--series-2);
  border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--text-secondary); margin-bottom: 14px;
}
footer { margin-top: 22px; font-size: 11px; color: var(--text-muted); line-height: 1.7; }

/* ---------- bottom tab bar ---------- */
nav.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: 1fr 1fr;
  background: var(--surface-1);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
nav.tabbar button {
  background: none; border: none; border-radius: 0;
  padding: 8px 0 9px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 11px; color: var(--text-muted);
}
nav.tabbar button[aria-selected="true"] { color: var(--series-1); font-weight: 650; }
nav.tabbar svg { width: 23px; height: 23px; display: block; }
</style>
</head>
<body>

<header>
  <h1>ローン比較</h1>
  <p>元利均等返済・毎月払い</p>
  <span class="ver" id="ver"></span>
</header>

<main>
  <div id="storage-warn" class="notice" hidden>
    この環境では入力内容を保存できません。閉じると内容は消えます。
  </div>

  <!-- ============ 条件ページ ============ -->
  <div class="page" id="page-cond">
    <h2>条件<span class="count" id="count"></span><span class="hintlabel" id="reorder-hint" hidden>長押しで並べ替え</span></h2>
    <div class="tabstrip" id="tabstrip" role="tablist"></div>
    <div id="panel"></div>
  </div>

  <!-- ============ グラフページ ============ -->
  <div class="page" id="page-chart" hidden>
    <h2>比較する条件</h2>
    <div class="chips" id="chips"></div>
    <div id="charts">
      <figure>
        <figcaption>月々の支払額</figcaption>
        <p class="fig-sub">少ないほど毎月の負担が軽い</p>
        <div id="chart1"></div>
      </figure>
      <figure>
        <figcaption>総支払額の内訳</figcaption>
        <p class="fig-sub">完済までに支払う合計額</p>
        <div class="legend">
          <span><i style="background:var(--series-1)"></i>元金</span>
          <span><i style="background:var(--series-2)"></i>利息</span>
        </div>
        <div id="chart2"></div>
      </figure>
      <details>
        <summary>数値を表で見る</summary>
        <div class="tablewrap"><table id="tbl"></table></div>
      </details>
    </div>
    <p class="empty" id="charts-empty" hidden>比較したい条件を上から選んでください。</p>

    <footer>
      ※ 元利均等返済・毎月払いの概算です。実際の返済額は金融機関ごとの計算方法・端数処理・手数料・保証料などにより異なります。<br>
      ※ 入力内容はこの端末のブラウザ内にのみ保存されます。
    </footer>
  </div>
</main>

<nav class="tabbar" role="tablist">
  <button type="button" id="nav-cond" role="tab" aria-selected="true" aria-controls="page-cond">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <path d="M4 7h16M4 12h16M4 17h16"/>
      <circle cx="9" cy="7" r="2.4" fill="var(--surface-1)"/>
      <circle cx="15" cy="12" r="2.4" fill="var(--surface-1)"/>
      <circle cx="8" cy="17" r="2.4" fill="var(--surface-1)"/>
    </svg>
    条件
  </button>
  <button type="button" id="nav-chart" role="tab" aria-selected="false" aria-controls="page-chart">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <rect x="3" y="13" width="4.6" height="8" rx="1.2"/>
      <rect x="9.7" y="8" width="4.6" height="13" rx="1.2"/>
      <rect x="16.4" y="3.5" width="4.6" height="17.5" rx="1.2"/>
    </svg>
    グラフ
  </button>
</nav>

<div id="tip" role="tooltip" aria-hidden="true"></div>

<script>
(function () {
  'use strict';

  var MAX = 10;
  var KEY = 'loan-compare-v3';

  var seq = 1;
  var items = [];
  var activeId = null;
  var page = 'cond';

  function blank(src) {
    var it = {
      id: 'c' + (seq++),
      name: '',
      man:      src ? src.man      : 3000,  // 借入金額（万円）
      termVal:  src ? src.termVal  : 35,    // 返済期間の入力値
      termUnit: src ? src.termUnit : 'y',   // 'y' = 年 / 'n' = 回
      rate:     src ? src.rate     : 1.0,   // 年利（%）
      on:       true
    };
    it.name = autoName(it) || ('条件' + (items.length + 1));
    return it;
  }

  // 返済期間の入力値 → 支払い回数
  function periods(it) {
    var v = Number(it.termVal);
    if (!isFinite(v) || v <= 0) return NaN;
    return Math.round(it.termUnit === 'y' ? v * 12 : v);
  }

  // 条件名の自動生成:「借入金額(万円)_返済年数_年利(%)」例) 600万円・10年・2% → 600_10_2
  // 12の倍数の回数は年に換算し、割り切れないときだけ「400回」と表記する。入力が不完全なら null
  function autoName(it) {
    var man = Number(it.man), rate = Number(it.rate), n = periods(it);
    if (!isFinite(man) || man <= 0 || !isFinite(rate) || rate < 0 || !isFinite(n) || n <= 0) return null;
    var term = (n % 12 === 0) ? String(n / 12) : (n + '回');
    return String(man) + '_' + term + '_' + String(rate);
  }
  function byId(id) {
    for (var i = 0; i < items.length; i++) { if (items[i].id === id) return items[i]; }
    return null;
  }

  // ---------- storage ----------
  var storageOK = true;
  function warnStorage() {
    storageOK = false;
    document.getElementById('storage-warn').hidden = false;
  }
  function save() {
    if (!storageOK) return;
    try {
      localStorage.setItem(KEY, JSON.stringify({
        seq: seq, items: items, activeId: activeId, page: page
      }));
    } catch (e) { warnStorage(); }
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return false;
      var d = JSON.parse(raw);
      if (!d || !Array.isArray(d.items) || !d.items.length) return false;
      items = d.items.slice(0, MAX);
      items.forEach(function (it) {          // 旧形式（支払い回数のみ）からの移行
        if (it.termVal == null) {
          it.termVal = Number(it.n) || 420;
          it.termUnit = 'n';
        }
        if (it.termUnit !== 'y' && it.termUnit !== 'n') it.termUnit = 'n';
      });
      seq = d.seq || items.length + 1;
      activeId = byId(d.activeId) ? d.activeId : items[0].id;
      page = (d.page === 'chart') ? 'chart' : 'cond';
      return true;
    } catch (e) { warnStorage(); return false; }
  }

  // ---------- math ----------
  // 元利均等返済:  M = P·r / (1 − (1+r)^−n)      r = 年利 / 12
  function calc(it) {
    var P = Number(it.man) * 10000;
    var n = periods(it);
    var a = Number(it.rate);
    if (!isFinite(P) || !isFinite(n) || !isFinite(a)) return null;
    if (P <= 0 || n <= 0 || a < 0) return null;
    var r = a / 100 / 12;
    var m = (r === 0) ? P / n : P * r / (1 - Math.pow(1 + r, -n));
    if (!isFinite(m) || m <= 0) return null;
    var monthly = Math.round(m);
    var total = monthly * n;           // 表示上「月々 × 回数」と一致させる
    return { principal: P, monthly: monthly, total: total, interest: total - P };
  }

  // ---------- format ----------
  function yen(v) { return '¥' + Math.round(v).toLocaleString('ja-JP'); }
  function num(v) { return Math.round(v).toLocaleString('ja-JP'); }
  // 「35年（420回）」— 年・回のどちらで入力しても両方を示す
  function termLabel(it) {
    var n = periods(it);
    if (!isFinite(n) || n <= 0) return '';
    var y = Math.floor(n / 12), m = n % 12;
    var span = (y ? y + '年' : '') + (m ? m + 'ヶ月' : (y ? '' : n + 'ヶ月'));
    return span + '（' + num(n) + '回）';
  }

  // ---------- アニメーション（家計簿アプリ js/anim.js の「ぽよん」を移植） ----------
  // CSS / Web Animations API のみ。OS の「視差効果を減らす」が ON のときは何も動かさない
  var SPRING = 'cubic-bezier(.3,1.9,.5,1)';
  var OUT = 'cubic-bezier(.2,.8,.3,1)';
  var motionQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  function reduced() { return !!(motionQuery && motionQuery.matches); }
  function easeOut(k) { return 1 - Math.pow(1 - k, 3); }

  function play(el, keyframes, options) {
    if (!el || reduced() || !el.animate) return null;
    options.fill = 'backwards';
    return el.animate(keyframes, options);
  }

  /* ページ / パネルの切替:横からスライドして弾む。dx は出発点の横ずれ(px) */
  function slideIn(el, dx) {
    play(el, [{ opacity: 0, transform: 'translateX(' + dx + 'px)' }, { opacity: 1, transform: 'none' }], {
      duration: 650,
      easing: SPRING
    });
  }

  /* 上からビヨンと落ちてくる(追加・複製したタブ) */
  function dropIn(el) {
    play(el, [{ opacity: 0, transform: 'translateY(-26px) scale(.85)' }, { opacity: 1, transform: 'none' }], {
      duration: 600,
      easing: SPRING
    });
  }

  /* ボタンを押したときの潰れて戻る動き */
  function pressPop(el) {
    play(el, [
      { transform: 'scale(1)' },
      { transform: 'scale(.88, 1.08)' },
      { transform: 'scale(1.08, .94)' },
      { transform: 'scale(1)' }
    ], { duration: 420, easing: 'ease-out' });
  }

  /* 追加完了:衝撃波とキラキラ */
  function celebrate(anchor) {
    if (reduced() || !anchor || !anchor.animate) return;
    var r = anchor.getBoundingClientRect();
    var cx = r.left + r.width / 2;
    var cy = r.top + r.height / 2;
    var layer = document.createElement('div');
    layer.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;';
    document.body.appendChild(layer);

    var ring = document.createElement('i');
    ring.style.cssText = 'position:absolute;left:' + (cx - 10) + 'px;top:' + (cy - 10) + 'px;width:20px;height:20px;border-radius:50%;border:3px solid #FF8FC7;';
    layer.appendChild(ring);
    ring.animate(
      [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(11)', opacity: 0 }],
      { duration: 700, easing: 'ease-out' }
    );

    var COUNT = 30;
    for (var i = 0; i < COUNT; i++) {
      var s = document.createElement('i');
      var size = 6 + Math.random() * 7;
      s.style.cssText = 'position:absolute;left:' + cx + 'px;top:' + cy + 'px;width:' + size + 'px;height:' + size + 'px;border-radius:50%;background:hsl(' + ((i * 360) / COUNT) + ',85%,75%);';
      layer.appendChild(s);
      var angle = Math.random() * Math.PI * 2;
      var dist = 60 + Math.random() * 90;
      s.animate(
        [
          { transform: 'translate(0,0) scale(1)', opacity: 1 },
          { transform: 'translate(' + (Math.cos(angle) * dist) + 'px,' + (Math.sin(angle) * dist - 30) + 'px) scale(0)', opacity: 0 }
        ],
        { duration: 900 + Math.random() * 400, easing: OUT }
      );
    }
    setTimeout(function () { layer.remove(); }, 2000);
  }

  /* 横棒:左から一斉になめらかに伸びる */
  function growBars(list) {
    Array.prototype.forEach.call(list, function (b) {
      play(b, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 700, easing: OUT });
    });
  }

  /* 文字を text に落ち着かせる。animate なら最初の数字(¥と,を含む)を0から数え上げる。
   * 描画が止まる環境でも最終値が必ず表示されるよう、タイマーでも確定させる */
  function setText(el, text, animate) {
    el.__cu = (el.__cu || 0) + 1;            // 進行中のカウントアップを打ち切る
    var my = el.__cu;
    el.textContent = text;
    if (!animate || reduced()) return;
    var m = text.match(/-?[\d,]+/);
    if (!m) return;
    var target = parseInt(m[0].replace(/,/g, ''), 10);
    if (!target) return;
    var head = text.slice(0, m.index);
    var tail = text.slice(m.index + m[0].length);
    var D = 900;
    var t0 = performance.now();
    function frame(t) {
      if (el.__cu !== my) return;             // 途中で別の内容に変わったら中断
      var k = Math.min(1, (t - t0) / D);
      el.textContent = k < 1 ? head + Math.round(target * easeOut(k)).toLocaleString('ja-JP') + tail : text;
      if (k < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    setTimeout(function () { if (el.__cu === my) el.textContent = text; }, D + 150);
  }

  // ---------- elements ----------
  var stripEl = document.getElementById('tabstrip');
  var panelEl = document.getElementById('panel');
  var countEl = document.getElementById('count');
  var chipsEl = document.getElementById('chips');
  var chartsEl = document.getElementById('charts');
  var emptyEl = document.getElementById('charts-empty');
  var c1 = document.getElementById('chart1');
  var c2 = document.getElementById('chart2');
  var tbl = document.getElementById('tbl');
  var activeTabBtn = null;
  var panelRefresh = null;   // 表示中の条件パネルの計算結果を再描画する関数

  // ---------- condition tab strip ----------
  // opts.dropId: そのタブだけ上から落ちてくる(追加・複製)
  function renderTabs(opts) {
    opts = opts || {};
    stripEl.textContent = '';
    activeTabBtn = null;
    items.forEach(function (it) {
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('role', 'tab');
      b.setAttribute('data-id', it.id);
      b.textContent = it.name || '(無題)';
      var on = it.id === activeId;
      b.setAttribute('aria-selected', on ? 'true' : 'false');

      b.addEventListener('click', function () {

        var dir = items.indexOf(it) > items.indexOf(byId(activeId)) ? 1 : -1;
        activeId = it.id; save(); renderTabs(); renderPanel({ anim: true, dir: dir });
      });
      b.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        startPress(e, b, it);
      });
      stripEl.appendChild(b);
    });

    add.type = 'button';
    add.className = 'addtab';

      save(); renderTabs({ dropId: it.id }); renderPanel({ anim: true, dir: 1 });
      var nextAdd = stripEl.querySelector('.addtab');   // 描き直された「＋」
      pressPop(nextAdd);

    });

    document.getElementById('reorder-hint').hidden = items.length < 2;

  // ---------- タブの並べ替え（長押し → ドラッグ） ----------
  var HOLD_MS = 350;   // 長押しと判定するまで
  var SLOP = 8;        // これ以上動いたら横スクロール操作とみなす
  var press = null;    // 長押し待ち
  var drag = null;     // ドラッグ中
  var rafId = 0;
  var justDragged = false;

  function tabButtons() {
    return Array.prototype.filter.call(stripEl.children, function (b) {
      return b.hasAttribute('data-id');
    });
  }
  function cancelPress() {
    if (press) { clearTimeout(press.timer); press = null; }
  }
  function startPress(e, el, it) {
    if (items.length < 2) return;
    cancelPress();
    var x = e.clientX, y = e.clientY, pid = e.pointerId;
    var p = { el: el, it: it, x: x, y: y, timer: 0 };
    p.timer = setTimeout(function () {
      if (press === p) { press = null; beginDrag(el, it, x, pid); }
    }, HOLD_MS);
    press = p;
  }

  function beginDrag(el, it, x, pointerId) {
    drag = { el: el, it: it, offset: 0, lastX: x, pointerId: pointerId };
    el.classList.add('drag-src');
    try { el.setPointerCapture(pointerId); } catch (err) { /* 無くても動く */ }
    applyDragTransform();
    rafId = requestAnimationFrame(dragTick);
  }
  function applyDragTransform() {
    drag.el.style.transform = 'translateX(' + drag.offset + 'px) scale(1.06)';
  }

  // 端に寄せている間はストリップを自動スクロールし、そのぶん指の下に留める。
  // 並べ替えの判定は pointermove 側で行う（フレームが止まっても効くように）。
  function dragTick() {
    if (!drag) return;
    var r = stripEl.getBoundingClientRect();
    var before = stripEl.scrollLeft;
    if (drag.lastX < r.left + 44) stripEl.scrollLeft -= 12;
    else if (drag.lastX > r.right - 44) stripEl.scrollLeft += 12;
    var ds = stripEl.scrollLeft - before;
    if (ds) { drag.offset += ds; applyDragTransform(); reorderIfNeeded(); }
    rafId = requestAnimationFrame(dragTick);
  }

  function reorderIfNeeded() {
    // scale は中心を動かさないので、見た目の中心 = 本来の中心 + offset
    var rect = drag.el.getBoundingClientRect();
    var visualCenter = rect.left + rect.width / 2;

    var ref = null;
    var others = tabButtons();
    for (var i = 0; i < others.length; i++) {
      if (others[i] === drag.el) continue;
      var rr = others[i].getBoundingClientRect();
      if (visualCenter < rr.left + rr.width / 2) { ref = others[i]; break; }
    }
    var target = ref || stripEl.querySelector('.addtab');
    if (drag.el.nextElementSibling === target) return;

    stripEl.insertBefore(drag.el, target);
    drag.el.style.transform = 'scale(1.06)';          // offset を外して実位置を測る
    var moved = drag.el.getBoundingClientRect();
    drag.offset = visualCenter - (moved.left + moved.width / 2);
    applyDragTransform();
    syncOrderFromDOM();
  }

  function syncOrderFromDOM() {
    var order = [];
    tabButtons().forEach(function (b) {
      var it = byId(b.getAttribute('data-id'));
      if (it) order.push(it);
    });
    if (order.length === items.length) items = order;
  }

  function endDrag() {
    if (!drag) return;
    cancelAnimationFrame(rafId);
    var it = drag.it;
    try { drag.el.releasePointerCapture(drag.pointerId); } catch (err) {}
    drag.el.style.transform = '';
    drag.el.classList.remove('drag-src');
    drag = null;
    justDragged = true;
    setTimeout(function () { justDragged = false; }, 0);
    activeId = it.id;
    save(); renderTabs(); renderPanel();
  }

  document.addEventListener('pointermove', function (e) {
    if (drag) {
      drag.offset += e.clientX - drag.lastX;
      drag.lastX = e.clientX;
      applyDragTransform();
      reorderIfNeeded();
    } else if (press) {
      if (Math.abs(e.clientX - press.x) > SLOP || Math.abs(e.clientY - press.y) > SLOP) cancelPress();
    }

  // ドラッグ中はタッチの横スクロールを止める（touch-action の切替はジェスチャ途中では効かない）

  // ---------- condition panel ----------
  function field(labelText, unit, value, attrs, cls) {

      var u = document.createElement('span'); u.className = 'unit'; u.textContent = unit;

    // 年／回で入力レンジを切り替える
    function applyTermUnit() {

    // animate: 計算結果を0から数え上げる(入力中は即時反映なので false)
    function refresh(animate) {

      fTerm.hint.textContent = termLabel(it);

  // ---------- chips ----------

  // ---------- charts ----------

  // animate: 横棒を左から一斉に伸ばし、金額を数え上げる

    var data = [];

      var r = calc(it);
      if (it.on && r) data.push({ it: it, r: r });
    });

    var has = data.length > 0;
    chartsEl.hidden = !has;
    emptyEl.hidden = has;
    if (!has) return;

    var maxM = 0, maxT = 0;
    data.forEach(function (d) {

      if (d.r.total > maxT) maxT = d.r.total;
    });

    c1.textContent = '';
    c2.textContent = '';
    data.forEach(function (d) {
      c1.appendChild(row(d.it, d.r, 'monthly', maxM));

  // ---------- tooltip ----------

    ].forEach(function (p) {

  function placeTip(x, y) {
    var pad = 10;
    tipEl.style.left = '0px'; tipEl.style.top = '0px';
    var w = tipEl.offsetWidth, h = tipEl.offsetHeight;

  document.addEventListener('pointerdown', function () { if (tipRow) hideTip(); });
  window.addEventListener('scroll', function () { if (tipRow) hideTip(); }, { passive: true });

  // ---------- page switching ----------
  var pages = { cond: document.getElementById('page-cond'), chart: document.getElementById('page-chart') };
  var navs  = { cond: document.getElementById('nav-cond'),  chart: document.getElementById('nav-chart') };

  // animate: ページが横からスライドして弾み、表示した内容が動く
  function showPage(p, animate) {
    page = p;
    hideTip();
    Object.keys(pages).forEach(function (k) {
      pages[k].hidden = (k !== p);
      navs[k].setAttribute('aria-selected', k === p ? 'true' : 'false');
    });
    if (p === 'chart') { renderChips(); renderCharts(animate); }
    else if (animate && panelRefresh) panelRefresh(true);
    window.scrollTo(0, 0);
    if (animate) slideIn(pages[p], p === 'chart' ? 60 : -60);
    save();
  }
  function goPage(p) {
    pressPop(navs[p]);
    showPage(p, page !== p);
  }
  navs.cond.addEventListener('click', function () { goPage('cond'); });
  navs.chart.addEventListener('click', function () { goPage('chart'); });

  // ---------- バージョン表示 ----------
  // 更新のたびに sw.js の CACHE_NAME と同じ番号に上げる。画面右上の表示で新旧が一目で分かる
  var APP_VERSION = 'v3';
  document.getElementById('ver').textContent = APP_VERSION;

  // ---------- service worker (offline / 自動更新) ----------
  if ('serviceWorker' in navigator) {
    // 新しい版が引き継いだら、一度だけ読み直して新版にする（入力内容は都度保存されているので失われない）。
    // 初めてインストールされたとき（controller が無かったとき）は読み直さない
    var hadController = !!navigator.serviceWorker.controller;
    var reloadedForUpdate = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController || reloadedForUpdate) return;
      reloadedForUpdate = true;
      location.reload();
    });

    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
        // アプリを開き直した・裏から戻ったときにも更新を確認する
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') reg.update().catch(function () {});
        });
      }).catch(function () { /* 対応外環境では無視 */ });
    });
  }

  // ---------- boot ----------
  if (!load()) {
    items = [blank(null)];
    activeId = items[0].id;
    page = 'cond';
  }
  renderTabs();
  renderPanel({ anim: true });   // 起動時は金額の数え上げだけ
  showPage(page);
})();
</script>
</body>
</html>
